services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/exemplo_spring_boot_2?allowMultiQueries=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD:
      JWT_SECRET: "mK9vR2xP7qL4nT8wY5zA3bC6dE1fG0hJ9kM2pQ5sV8xN"
      JWT_ISSUER: "exemplo-spring-boot-2"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: exemplo_spring_boot_2
    healthcheck:
      test: [ "CMD", "mysql", "-u", "root", "-e", "USE exemplo_spring_boot_2;" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
